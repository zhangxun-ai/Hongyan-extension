name: 功能建议
description: 说明你希望红研帮助解决的具体问题。
title: "[建议] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 当前遇到的问题
      description: 在什么场景下，哪一步最费时间或难以完成？
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 希望达到的结果
      description: 描述你想完成的任务，也可以给一个例子。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 当前解决方式
      description: 可选，介绍你目前如何处理这个问题。
    validations:
      required: false
